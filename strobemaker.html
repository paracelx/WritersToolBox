            background: #0a0a0a;

            border-radius: 6px;
            width: 700px;
            max-width: 95vw;
            max-height: 95vh;
            overflow-y: auto;
            box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(255,176,0,0.1);

        }

        h2 { text-align: center; margin-bottom: 5px; font-size: 1.15em; letter-spacing: 2px; }
        .credit { text-align: center; font-size: 0.75em; color: #777; margin-bottom: 25px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .warning { text-align: center; font-size: 0.7em; color: #ff4444; margin-bottom: 15px; letter-spacing: 1px; font-weight: bold;}

        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        button.mode-btn {
            background: #111;
            border: 1px solid #ffb000;
            color: #ffb000;
            padding: 12px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.8em;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
            transition: 0.2s;
            text-align: left;
        }
        button.mode-btn:hover { background: #ffb000; color: #000; }
        button.mode-btn.active { background: #ffb000; color: #000; box-shadow: 0 0 15px rgba(255,176,0,0.6); }

        /* Highlight the new mode */
        #btn-fracture { border-color: #a344ff; color: #a344ff; }
        #btn-fracture:hover { background: #a344ff; color: #000; }
        #btn-fracture.active { background: #a344ff; color: #000; box-shadow: 0 0 15px rgba(163, 68, 255, 0.6); }

        #btn-abyssal { border-color: #ff3300; color: #ff3300; }
        #btn-abyssal:hover { background: #ff3300; color: #000; }
        #btn-abyssal.active { background: #ff3300; color: #000; box-shadow: 0 0 15px rgba(255, 51, 0, 0.6); }

        #btn-void { border-color: #5555ff; color: #5555ff; }
        #btn-void:hover { background: #5555ff; color: #000; }
        #btn-void.active { background: #5555ff; color: #000; box-shadow: 0 0 15px rgba(85, 85, 255, 0.6); }

        #btn-weaver { border-color: #00ffaa; color: #00ffaa; }
        #btn-weaver:hover { background: #00ffaa; color: #000; }
        #btn-weaver.active { background: #00ffaa; color: #000; box-shadow: 0 0 15px rgba(0, 255, 170, 0.6); }

        .action-row {
            display: flex;
            gap: 10px;
        }

        button.engage-btn {
            flex: 1;
            background: #4CAF50;
            border: 1px solid #4CAF50;
            color: #fff;
            padding: 14px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9em;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 4px;
            transition: 0.2s;
        }
        button.engage-btn:hover { background: #388E3C; }
        button.engage-btn.running { background: #f44336; border-color: #f44336; }

        /* FULLSCREEN AMBIENT STAGE */
        #ambient-stage {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: none;
            overflow: hidden;
            transition: background 1s ease;
        }
        #ambient-stage.active { display: flex; }

        /* CANVAS FOR PROCEDURAL FLUID EFFECTS */
        #effect-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
        }

        .stage-text {
            position: relative;
            z-index: 10;
            font-size: 1.6vw;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            max-width: 75vw;
            line-height: 1.6;
            opacity: 0.85;

            letter-spacing: 1px;

        };

        // Initialize Webbing Nodes
        for(let i=0; i<35; i++) {
            webNodes.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 0.4,
                vy: (Math.random() - 0.5) * 0.4
            });
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            if (isRunning) {
                updateTextPhrase();
            }
        }

        function toggleStage() {
            if (isRunning) {
                stopStage();
            } else {
                startStage();
            }
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            // 18Hz Sub-Perceptual Infrasound implementation
            infrasoundOsc = audioCtx.createOscillator();
            infrasoundOsc.type = 'sine';
            infrasoundOsc.frequency.setValueAtTime(18.0, audioCtx.currentTime); 
            
            gainNode = audioCtx.createGain();
            
            // Baseline increases with trauma level
            let baseGain = 0.06 + (traumaLevel * 0.005);
            gainNode.gain.setValueAtTime(baseGain, audioCtx.currentTime); 
            
            infrasoundOsc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            infrasoundOsc.start();
        }

        function stopAudio() {
            if (infrasoundOsc) {
                // Fade out to prevent popping
                gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.5);
                infrasoundOsc.stop(audioCtx.currentTime + 1);
                setTimeout(() => {
                    if (infrasoundOsc) infrasoundOsc.disconnect();
                }, 1000);
            }
        }

        function startStage() {
            isRunning = true;
            stageStartTime = Date.now();
            
            // Increment Session Trauma
            traumaLevel += 1;
            localStorage.setItem('occult_trauma', traumaLevel);
            document.getElementById('trauma-display').innerText = `SESSION TRAUMA LEVEL: ${traumaLevel} [PERMANENT DEGRADATION ACTIVE]`;

            document.getElementById('ambient-stage').classList.add('active');
            document.getElementById('engage-btn').innerText = "DISENGAGE AMBIENT STAGE";
            document.getElementById('engage-btn').classList.add('running');
            
            canvas = document.getElementById('effect-canvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // Init occult audio triggers
            initAudio();

            updateTextPhrase();
            textTimer = setInterval(updateTextPhrase, 9000);

            runSimulation();
        }

        function stopStage() {
            isRunning = false;
            cancelAnimationFrame(animationFrameId);
            clearInterval(textTimer);
            window.removeEventListener('resize', resizeCanvas);
            document.getElementById('ambient-stage').classList.remove('active');
            document.getElementById('engage-btn').innerText = "ENGAGE AMBIENT STAGE";
            document.getElementById('engage-btn').classList.remove('running');
            
            stopAudio();
        }

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function updateTextPhrase() {
            const config = modeConfigs[currentMode];
            const textEl = document.getElementById('stage-text');
            textEl.style.color = config.textColor;
            textEl.style.opacity = '0';
            
            let elapsed = Date.now() - stageStartTime;
            // Trauma accelerates cognitive slippage in text
            let degMult = 1 + (elapsed / ULTRADIAN_CYCLE_MS) + (traumaLevel * 0.2);
            
            setTimeout(() => {
                let phrase = config.phrases[Math.floor(Math.random() * config.phrases.length)];
                if (degMult > 1.2 && Math.random() < 0.3) {
                    // Inject erratic characters representing cognitive slippage
                    phrase = phrase.replace(/[aeiou]/g, () => ['x', 'ø', 'æ', '†'][Math.floor(Math.random()*4)]);
                }
                textEl.innerText = phrase;
                textEl.style.opacity = '0.85';
            }, 600);
        }

        // Procedural Animation Loop 
        let time = 0;
        let particles = [];
        
        // Initialize particle buffers for obsession mode
        for(let i=0; i<60; i++) {
            particles.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                speed: Math.random() * 2 + 0.5,
                char: String.fromCharCode(33 + Math.floor(Math.random() * 90)),
                alpha: Math.random() * 0.5 + 0.1
            });
        }

        // Generate random hex string for subliminals
        function getRandomHexString(length) {
            let result = '';
            const hexChars = '0123456789ABCDEF';
            for (let i = 0; i < length; i++) {
                result += hexChars.charAt(Math.floor(Math.random() * hexChars.length));
            }
            return result;
        }

        // --- RENDER LOGIC REFACTOR FOR SPATIAL ASYMMETRY ---

        // Extracted visual loops to allow dual-rendering (left/right split)
        function drawEffects(t, degradationFactor, doUpdate) {
            if (currentMode === 'despair') {
                let pulse = (Math.sin(t * 0.5) + 1) / 2;
                let grad = ctx.createRadialGradient(
                    canvas.width / 2, canvas.height / 2, 50,
                    canvas.width / 2, canvas.height / 2, Math.max(canvas.width, canvas.height) * 0.8
                );
                grad.addColorStop(0, `rgba(10, 15, 25, ${0.8 + pulse * 0.2})`);
                grad.addColorStop(0.5, `rgba(3, 5, 10, ${0.95 + pulse * 0.05})`);
                grad.addColorStop(1, '#000000');
                
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = `rgba(114, 137, 218, ${0.03 + pulse * 0.02 * degradationFactor})`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                for(let i=0; i<canvas.height; i+=40) {
                    ctx.moveTo(0, i + Math.sin(t + i) * 10 * degradationFactor);
                    ctx.lineTo(canvas.width, i + Math.cos(t + i) * 10 * degradationFactor);
                }
                ctx.stroke();

            } else if (currentMode === 'obsession') {
                let fadeAlpha = Math.max(0.05, 0.25 - (degradationFactor * 0.02)); 
                ctx.fillStyle = `rgba(5, 5, 5, ${fadeAlpha})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.font = '14px "Courier New", monospace';
                particles.forEach(p => {
                    ctx.fillStyle = `rgba(255, 176, 0, ${p.alpha})`;
                    ctx.fillText(p.char, p.x, p.y);
                    if (doUpdate) {
                        p.y += p.speed * degradationFactor;
                        if (p.y > canvas.height) {
                            p.y = -20;
                            p.x = Math.random() * canvas.width;
                            p.char = String.fromCharCode(33 + Math.floor(Math.random() * 90));
                        }
                    }
                });

            } else if (currentMode === 'panic') {
                ctx.fillStyle = '#020202';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                let glitchChance = 0.3 * Math.min(degradationFactor, 3);
                if (Math.random() < glitchChance) {
                    let yPos = Math.random() * canvas.height;
                    let height = Math.random() * 6 * degradationFactor + 1;
                    ctx.fillStyle = Math.random() < 0.5 ? 'rgba(255, 68, 68, 0.8)' : 'rgba(255, 255, 255, 0.9)';
                    let startX = Math.random() < 0.5 ? 0 : canvas.width - (300 * degradationFactor);
                    ctx.fillRect(startX, yPos, Math.random() * 300 + 50, height);
                }

                if (Math.random() < 0.03 * degradationFactor) {
                    ctx.fillStyle = `rgba(255,255,255,${0.08 * degradationFactor})`; 
                    if (Math.random() > 0.5) {
                        let cx = Math.random() * canvas.width;
                        let cy = Math.random() * canvas.height;
                        let size = 100 + Math.random() * 400;
                        ctx.beginPath();
                        ctx.moveTo(cx - size/2, cy - size/2);
                        ctx.lineTo(cx + size/2, cy - size/2);
                        ctx.lineTo(cx, cy + size/2); 
                        ctx.fill();
                    } else {
                        ctx.font = 'bold 48px monospace';
                        let str = getRandomHexString(16);
                        ctx.fillText(str, Math.random() * canvas.width * 0.8, Math.random() * canvas.height);
                    }
                }

                let grad = ctx.createRadialGradient(
                    canvas.width / 2, canvas.height / 2, canvas.width * 0.2,
                    canvas.width / 2, canvas.height / 2, canvas.width * 0.7
                );
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(1, 'rgba(48, 8, 8, 0.6)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

            } else if (currentMode === 'hate') {
                let heatPulse = (Math.sin(t * 3) + 1) / 2;
                let coreExpansion = 50 * degradationFactor;
                let grad = ctx.createRadialGradient(
                    canvas.width / 2, canvas.height / 2, 10,
                    canvas.width / 2, canvas.height / 2, canvas.width * 0.6 + heatPulse * coreExpansion
                );
                grad.addColorStop(0, `rgba(153, 0, 0, ${0.4 * degradationFactor})`);
                grad.addColorStop(0.4, 'rgba(43, 10, 10, 0.8)');
                grad.addColorStop(1, '#050202');

                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.strokeStyle = `rgba(255, 34, 34, ${0.08 * degradationFactor})`;
                ctx.lineWidth = 2;
                ctx.beginPath();
                for(let x=0; x<canvas.width; x+=60) {
                    ctx.moveTo(x, 0);
                    ctx.bezierCurveTo(
                        x + Math.sin(t + x)*30, canvas.height * 0.3,
                        x - Math.sin(t + x)*30, canvas.height * 0.7,
                        x, canvas.height
                    );
                }
                ctx.stroke();

            } else if (currentMode === 'fracture') {
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, canvas.width / 2, canvas.height);
                ctx.clip();
                
                ctx.fillStyle = '#080808';
                ctx.fillRect(0, 0, canvas.width/2, canvas.height);
                
                ctx.fillStyle = `rgba(200, 200, 200, ${0.05 * degradationFactor})`;
                for(let i=0; i<20; i++) {
                    let rx = Math.random() * (canvas.width/2);
                    let rw = Math.random() * 10;
                    ctx.fillRect(rx, 0, rw, canvas.height);
                }
                if (Math.random() < 0.1 * degradationFactor) {
                    ctx.fillStyle = `rgba(255, 255, 255, ${0.2 * degradationFactor})`;
                    ctx.fillRect(Math.random() * (canvas.width/2), Math.random() * canvas.height, canvas.width/2, 5);
                }
                ctx.restore();

                ctx.save();
                ctx.beginPath();
                ctx.rect(canvas.width / 2, 0, canvas.width / 2, canvas.height);
                ctx.clip();
                
                let phaseShift = t * 0.8;
                let rightGrad = ctx.createLinearGradient(canvas.width/2, 0, canvas.width, canvas.height);
                rightGrad.addColorStop(0, `rgba(50, 0, 80, ${0.8})`);
                rightGrad.addColorStop(0.5, `rgba(0, 60, 40, ${0.8})`);
                rightGrad.addColorStop(1, '#000');
                ctx.fillStyle = rightGrad;
                ctx.fillRect(canvas.width/2, 0, canvas.width/2, canvas.height);

                ctx.strokeStyle = `rgba(163, 68, 255, ${0.15 * degradationFactor})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                for(let y=0; y<canvas.height; y+=30) {
                    ctx.moveTo(canvas.width/2, y);
                    ctx.bezierCurveTo(
                        canvas.width * 0.7 + Math.sin(phaseShift + y*0.01) * 100, y + 50,
                        canvas.width * 0.8 - Math.cos(phaseShift + y*0.02) * 100, y - 50,
                        canvas.width, y + Math.sin(phaseShift)*20
                    );
                }
                ctx.stroke();
                
                ctx.fillStyle = `rgba(255, 255, 255, ${0.1 + Math.random()*0.3})`;
                ctx.fillRect(canvas.width/2 - 2, 0, 4, canvas.height);
                ctx.restore();
                
            } else if (currentMode === 'abyssal') {
                ctx.fillStyle = `rgba(30, 0, 0, ${0.3 * degradationFactor})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                let corePulse = (Math.sin(t * 4) + 1) / 2;
                let bgGrad = ctx.createLinearGradient(0, canvas.height, 0, 0);
                bgGrad.addColorStop(0, `rgba(100, 10, 0, ${0.8 * degradationFactor})`);
                bgGrad.addColorStop(0.5, `rgba(40, 0, 0, ${0.5 + corePulse * 0.2})`);
                bgGrad.addColorStop(1, '#000');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = `rgba(255, 80, 20, ${0.8 * degradationFactor})`;
                particles.forEach((p, i) => {
                    let sx = p.x + Math.sin(t * 2 + i) * 30 * degradationFactor;
                    let sy = p.y - (p.speed * 4 * degradationFactor);
                    if (doUpdate) {
                        if (sy < 0) p.y = canvas.height;
                        else p.y = sy;
                    }
                    let size = (Math.sin(t + i) + 2) * 2;
                    ctx.fillRect(sx, p.y, size, size);
                });

            } else if (currentMode === 'void') {
                ctx.fillStyle = `rgba(2, 2, 6, ${0.15 * degradationFactor})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.save();
                ctx.translate(canvas.width/2, canvas.height/2);
                ctx.rotate(t * 0.2 * degradationFactor);
                
                for(let i=1; i<=12; i++) {
                    ctx.rotate(Math.PI / 6);
                    ctx.strokeStyle = `rgba(85, 85, 255, ${0.05 * i * degradationFactor})`;
                    ctx.lineWidth = 1 + (Math.sin(t * 0.5 + i) + 1);
                    
                    let scale = 30 * i + Math.sin(t) * 10;
                    ctx.beginPath();
                    ctx.moveTo(0, -scale);
                    ctx.lineTo(scale * 0.866, scale * 0.5);
                    ctx.lineTo(-scale * 0.866, scale * 0.5);
                    ctx.closePath();
                    ctx.stroke();
                }
                ctx.restore();

            } else if (currentMode === 'weaver') {
                ctx.fillStyle = `rgba(5, 0, 10, ${0.2 * degradationFactor})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.strokeStyle = `rgba(0, 255, 170, ${0.08 * degradationFactor})`;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                
                let cx = canvas.width/2;
                let cy = canvas.height/2;
                
                for(let i=0; i<40; i++) {
                    let offX = Math.sin(t*0.3 + i)*500 * degradationFactor;
                    let offY = Math.cos(t*0.2 - i)*500 * degradationFactor;
                    
                    ctx.moveTo(cx + offX, cy + offY);
                    ctx.bezierCurveTo(
                        cx + Math.sin(t*0.1 + i*2)*700, cy - Math.cos(t*0.4 + i)*400,
                        cx - Math.sin(t*0.2 - i*2)*700, cy + Math.cos(t*0.3 - i)*400,
                        cx + Math.cos(t*0.5 + i)*600, cy + Math.sin(t*0.1 - i)*600
                    );
                }
                ctx.stroke();
            }
        }

        function runSimulation() {
            if (!isRunning) return;
            
            // Core Time Math (incorporating trauma level permanent scaling)
            let elapsed = Date.now() - stageStartTime;
            let baseFactor = 1 + Math.min((elapsed / ULTRADIAN_CYCLE_MS) * 4, 10);
            let degradationFactor = baseFactor * (1 + (traumaLevel * 0.15)); 
            
            time += 0.02 * degradationFactor;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // SPATIAL ASYMMETRY HANDLING
            if (currentMode === 'fracture') {
                // Fracture is already designed split
                drawEffects(time, degradationFactor, true);
            } else {
                // Split standard modes into desynchronized left/right halves
                ctx.save();
                ctx.beginPath();
                ctx.rect(0, 0, canvas.width / 2, canvas.height);
                ctx.clip();
                drawEffects(time, degradationFactor, true); 
                ctx.restore();

                ctx.save();
                ctx.beginPath();
                ctx.rect(canvas.width / 2, 0, canvas.width / 2, canvas.height);
                ctx.clip();
                // Right side operates in the future and slightly inverted logic depending on trauma
                let rightTime = time * (1.05 + traumaLevel * 0.01) + 1000;
                if (traumaLevel > 3 && Math.random() < 0.01) {
                    ctx.filter = 'invert(1)';
                }
                drawEffects(rightTime, degradationFactor, false); 
                ctx.filter = 'none';
                ctx.restore();
            }

            // PROCEDURAL GEOMETRIC WEBBING (Draws faintly over top of all modes)
            ctx.strokeStyle = `rgba(1, 1, 3, ${0.1 + (traumaLevel * 0.02)})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 0; i < webNodes.length; i++) {
                let n1 = webNodes[i];
                n1.x += n1.vx * degradationFactor;
                n1.y += n1.vy * degradationFactor;
                if(n1.x < 0 || n1.x > canvas.width) n1.vx *= -1;
                if(n1.y < 0 || n1.y > canvas.height) n1.vy *= -1;
                
                for (let j = i + 1; j < webNodes.length; j++) {
                    let n2 = webNodes[j];
                    let dist = Math.hypot(n1.x - n2.x, n1.y - n2.y);
                    if (dist < 180) {
                        ctx.moveTo(n1.x, n1.y);
                        // Occult bezier web curving
                        ctx.quadraticCurveTo(n1.x + (n2.x-n1.x)/2 + Math.sin(time)*30, n1.y + (n2.y-n1.y)/2 + Math.cos(time)*30, n2.x, n2.y);
                    }
                }
            }
            ctx.stroke();

            // KEYSTROKE DISSONANCE (Micro-tears)
            if (keystrokeSpike > 0.01) {
                ctx.fillStyle = `rgba(255, 255, 255, ${keystrokeSpike})`;
                for(let i=0; i<3; i++) {
                    let tx = Math.random() * canvas.width;
                    let ty = Math.random() * canvas.height;
                    ctx.fillRect(tx, ty, Math.random() * 200 + 50, Math.random() * 4);
                }
                // Bleed edge inversion
                if (Math.random() < 0.5) {
                    ctx.globalCompositeOperation = 'difference';
                    ctx.fillRect(0, Math.random()*canvas.height, canvas.width, 50 * keystrokeSpike);
                    ctx.globalCompositeOperation = 'source-over';
                }
                keystrokeSpike *= 0.85; // Rapid decay
            }

            animationFrameId = requestAnimationFrame(runSimulation);
        }

        // Keystroke Event Listener for Audio/Visual Dissonance
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && isRunning) {
                stopStage();
                return;
            }
            if (isRunning) {
                keystrokeSpike = 1.0;
                if (gainNode && audioCtx) {
                    let baseGain = 0.06 + (traumaLevel * 0.005);
                    gainNode.gain.cancelScheduledValues(audioCtx.currentTime);
                    // Rapid violent spike
                    gainNode.gain.setValueAtTime(baseGain * 4, audioCtx.currentTime);
                    // Exponential decay back to baseline
                    gainNode.gain.exponentialRampToValueAtTime(baseGain, audioCtx.currentTime + 0.4);
                }
            }
        });
    </script>
